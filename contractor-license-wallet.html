<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineSight | Contractor License & Certificate Wallet</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .user-tag {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Stats Overview */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .stat-card.valid .stat-value { color: var(--success); }
    .stat-card.expiring .stat-value { color: var(--warning); }
    .stat-card.expired .stat-value { color: var(--danger); }

    /* Action Header */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* License Cards List */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .license-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .license-card:hover {
      border-color: #475569;
      transform: translateY(-2px);
    }

    .license-card.border-danger {
      border-left: 4px solid var(--danger);
    }

    .license-card.border-warning {
      border-left: 4px solid var(--warning);
    }

    .license-card.border-success {
      border-left: 4px solid var(--success);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .doc-type {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .doc-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-valid {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .badge-warning {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border: 1px solid var(--warning);
    }

    .badge-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-value {
      color: var(--text-main);
      font-weight: 500;
    }

    .expiry-indicator {
      margin-top: 0.5rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .expiry-indicator.valid { background: rgba(34, 197, 94, 0.1); color: var(--success); }
    .expiry-indicator.warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
    .expiry-indicator.danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    .card-footer {
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-window {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-control {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .file-dropzone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.85rem;
      background: var(--bg-main);
    }

    .file-dropzone:hover {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">⛏</div>
      <div>
        <div class="brand-title">MineSight</div>
        <div class="brand-subtitle">Contractor Portal</div>
      </div>
    </div>
    <div class="user-tag">Contractor: CoalField Logistics Pvt Ltd</div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Top Stats -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-title">Total Uploaded Documents</span>
        <span class="stat-value" id="stat-total">3</span>
      </div>
      <div class="stat-card valid">
        <span class="stat-title">Active & Valid</span>
        <span class="stat-value" id="stat-valid">1</span>
      </div>
      <div class="stat-card expiring">
        <span class="stat-title">Expiring Soon (&le; 30 Days)</span>
        <span class="stat-value" id="stat-expiring">1</span>
      </div>
      <div class="stat-card expired">
        <span class="stat-title">Expired (Action Required)</span>
        <span class="stat-value" id="stat-expired">1</span>
      </div>
    </section>

    <!-- Actions & Filter Controls -->
    <section class="actions-bar">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="ALL">All Categories</button>
        <button class="filter-btn" data-filter="LABOR">Labor License</button>
        <button class="filter-btn" data-filter="EQUIPMENT">Equipment Fitness</button>
        <button class="filter-btn" data-filter="INSURANCE">Worker Insurance</button>
      </div>
      <button class="btn-primary" id="openUploadBtn">+ Upload License / Certificate</button>
    </section>

    <!-- License Cards Container -->
    <section class="cards-grid" id="licensesGrid">
      <!-- Dynamically Rendered Via JS -->
    </section>
  </main>

  <!-- Upload Modal -->
  <div class="modal-backdrop" id="uploadModal">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">Upload Certificate / License</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="licenseForm">
        <div class="form-group">
          <label class="form-label" for="docCategory">Document Category</label>
          <select class="form-control" id="docCategory" required>
            <option value="LABOR">Labor License (Contract Labour Act)</option>
            <option value="EQUIPMENT">Heavy Equipment Fitness Certificate</option>
            <option value="INSURANCE">Worker Compensation & Group Insurance</option>
          </select>
        </div>

        <div class="form-group" style="margin-top: 0.75rem;">
          <label class="form-label" for="docTitle">Certificate / License Name</label>
          <input type="text" class="form-control" id="docTitle" placeholder="e.g. DGMS Hauler Fitness Certificate" required />
        </div>

        <div class="form-group" style="margin-top: 0.75rem;">
          <label class="form-label" for="docNumber">Registration / Reference No.</label>
          <input type="text" class="form-control" id="docNumber" placeholder="e.g. WB-MIN-2024-8841" required />
        </div>

        <div class="form-group" style="margin-top: 0.75rem;">
          <label class="form-label" for="expiryDate">Expiry Date</label>
          <input type="date" class="form-control" id="expiryDate" required />
        </div>

        <div class="form-group" style="margin-top: 0.75rem;">
          <label class="form-label">Upload Document (PDF or Scan)</label>
          <div class="file-dropzone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" style="display: none;" accept=".pdf,image/*" />
            <p id="fileLabel">Click to select PDF or image file</p>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-primary">Save Document</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Seed Data aligned with MineSight Scope
    const licensesData = [
      {
        id: "doc-1",
        category: "LABOR",
        categoryLabel: "Labor License",
        title: "Contract Labour Regulation License (Form VI)",
        number: "CL-DHK-2025-9912",
        expiryDate: "2026-10-15",
        fileName: "labour_license_2025.pdf"
      },
      {
        id: "doc-2",
        category: "EQUIPMENT",
        categoryLabel: "Equipment Fitness",
        title: "Excavator & Dumper Fitness Audit (DGMS)",
        number: "EQ-FIT-8832-B",
        expiryDate: "2026-09-10",
        fileName: "dumper_fitness_sep26.pdf"
      },
      {
        id: "doc-3",
        category: "INSURANCE",
        categoryLabel: "Worker Insurance",
        title: "Workmen Compensation Policy (Pit Group B)",
        number: "INS-WCP-44021",
        expiryDate: "2026-08-20",
        fileName: "worker_policy_expired.pdf"
      }
    ];

    let currentFilter = "ALL";

    // Deterministic Expiry Logic
    function getExpiryStatus(expiryDateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const expDate = new Date(expiryDateStr);
      expDate.setHours(0, 0, 0, 0);

      const diffTime = expDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return {
          status: "EXPIRED",
          badgeClass: "badge-danger",
          indicatorClass: "danger",
          borderClass: "border-danger",
          badgeText: "Expired",
          message: `Expired ${Math.abs(diffDays)} days ago`
        };
      } else if (diffDays <= 30) {
        return {
          status: "EXPIRING_SOON",
          badgeClass: "badge-warning",
          indicatorClass: "warning",
          borderClass: "border-warning",
          badgeText: "Expiring Soon",
          message: `Expires in ${diffDays} day${diffDays === 1 ? '' : 's'}`
        };
      } else {
        return {
          status: "VALID",
          badgeClass: "badge-valid",
          indicatorClass: "valid",
          borderClass: "border-success",
          badgeText: "Valid",
          message: `Valid (${diffDays} days remaining)`
        };
      }
    }

    function updateStats() {
      let valid = 0;
      let expiring = 0;
      let expired = 0;

      licensesData.forEach(item => {
        const { status } = getExpiryStatus(item.expiryDate);
        if (status === "VALID") valid++;
        else if (status === "EXPIRING_SOON") expiring++;
        else if (status === "EXPIRED") expired++;
      });

      document.getElementById("stat-total").textContent = licensesData.length;
      document.getElementById("stat-valid").textContent = valid;
      document.getElementById("stat-expiring").textContent = expiring;
      document.getElementById("stat-expired").textContent = expired;
    }

    function renderLicenses() {
      const container = document.getElementById("licensesGrid");
      container.innerHTML = "";

      const filtered = currentFilter === "ALL" 
        ? licensesData 
        : licensesData.filter(d => d.category === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-muted);">No documents found in this category.</div>`;
        return;
      }

      filtered.forEach(item => {
        const statusInfo = getExpiryStatus(item.expiryDate);
        const card = document.createElement("div");
        card.className = `license-card ${statusInfo.borderClass}`;
        card.innerHTML = `
          <div>
            <div class="card-header">
              <div>
                <span class="doc-type">${item.categoryLabel}</span>
                <h4 class="doc-title">${item.title}</h4>
              </div>
              <span class="badge ${statusInfo.badgeClass}">${statusInfo.badgeText}</span>
            </div>
            <div class="card-body" style="margin-top: 1rem;">
              <div class="meta-row">
                <span class="meta-label">Reg / Ref No:</span>
                <span class="meta-value">${item.number}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Expiry Date:</span>
                <span class="meta-value">${item.expiryDate}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">Attached File:</span>
                <span class="meta-value" style="font-size: 0.8rem; color: var(--primary);">${item.fileName}</span>
              </div>
              <div class="expiry-indicator ${statusInfo.indicatorClass}">
                <span>●</span> ${statusInfo.message}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-secondary" onclick="alert('Viewing document: ${item.fileName}')">View File</button>
            <button class="btn-secondary" onclick="alert('Trigger re-upload / renewal for: ${item.number}')">Renew / Update</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Filter Button Handlers
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        renderLicenses();
      });
    });

    // Modal Handlers
    const uploadModal = document.getElementById("uploadModal");
    const openUploadBtn = document.getElementById("openUploadBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const licenseForm = document.getElementById("licenseForm");
    const fileInput = document.getElementById("fileInput");
    const fileLabel = document.getElementById("fileLabel");

    openUploadBtn.addEventListener("click", () => uploadModal.classList.add("open"));
    closeModalBtn.addEventListener("click", () => uploadModal.classList.remove("open"));
    cancelModalBtn.addEventListener("click", () => uploadModal.classList.remove("open"));

    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) {
        fileLabel.textContent = `Selected: ${e.target.files[0].name}`;
      }
    });

    licenseForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const cat = document.getElementById("docCategory").value;
      const catLabels = {
        LABOR: "Labor License",
        EQUIPMENT: "Equipment Fitness",
        INSURANCE: "Worker Insurance"
      };

      const newDoc = {
        id: `doc-${Date.now()}`,
        category: cat,
        categoryLabel: catLabels[cat],
        title: document.getElementById("docTitle").value,
        number: document.getElementById("docNumber").value,
        expiryDate: document.getElementById("expiryDate").value,
        fileName: fileInput.files[0] ? fileInput.files[0].name : "uploaded_document.pdf"
      };

      licensesData.unshift(newDoc);
      updateStats();
      renderLicenses();

      licenseForm.reset();
      fileLabel.textContent = "Click to select PDF or image file";
      uploadModal.classList.remove("open");
    });

    // Initial Load
    updateStats();
    renderLicenses();
  </script>
</body>
</html>
